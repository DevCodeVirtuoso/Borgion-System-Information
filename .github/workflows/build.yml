name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: dotnet build src -c Release

      - name: Package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/BorgionSystemInfo.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          $out = 'package/BorgionSystemInfo'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src/bin/Release/net48/BorgionSystemInfo.exe, src/bin/Release/net48/BorgionSystemInfo.exe.config $out
          Copy-Item deploy/*.ps1 $out
          Compress-Archive "$out/*" "package/BorgionSystemInfo-$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BorgionSystemInfo
          path: package/BorgionSystemInfo/

      # Bij elke push naar main met een nieuw versienummer in de .csproj komt er een release bij.
      - name: Check release exists
        if: github.event_name == 'push'
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:VERSION" 2>$null
          if ($LASTEXITCODE -eq 0) { "exists=true" | Out-File $env:GITHUB_OUTPUT -Append } else { "exists=false" | Out-File $env:GITHUB_OUTPUT -Append }
          exit 0

      - name: Create release
        if: github.event_name == 'push' && steps.rel.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" "package/BorgionSystemInfo-$env:VERSION.zip" `
            "package/BorgionSystemInfo/BorgionSystemInfo.exe" `
            --title "Borgion System Information v$env:VERSION" `
            --notes "Download de zip, pak uit en voer Installeren.ps1 uit als administrator. Zie README voor uitrol via GPO/Intune."
